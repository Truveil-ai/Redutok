name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json; specifying
      # it here too makes pnpm/action-setup fail with "Multiple versions of
      # pnpm specified".
      - uses: pnpm/action-setup@v4
      # Node 24: better-sqlite3 ships no prebuilt binary for node 20, and the
      # source-build fallback fails on windows-latest (node-gyp does not know
      # Visual Studio 2026). Node 24 (ABI 137) has prebuilds for all platforms
      # and matches local development.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
