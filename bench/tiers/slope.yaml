# Slope tier (v4 session 4): the tier that measures compounding.
#
# Three related-but-distinct tasks on the same vendored chalk fixture, all in
# the styling-internals knowledge neighborhood (createStyler's open/close
# accumulation, applyStyle's nested-ANSI re-opening, the STYLER parent
# chain), so no answer can be copied forward — only knowledge can. Both
# variants run the sequence in order in fresh sessions per task; the redutok
# variant carries its .dcp state (candidates, codex, mirror) forward across
# the sequence in one persistent copy per repetition, with the post-session
# graduation pass required to complete between tasks; vanilla starts cold
# each task. That asymmetry is the product claim under test.
#
# The criteria below were written before any run of this tier existed and are
# the only criteria the harness will evaluate (loadSlopeTier refuses any
# other id). House rule: no bar movement after the fact.
tier: slope
id: slope-chalk
sequence: [s01, s02, s03]
criteria:
  - id: slope-exists
    description: >-
      redutok s3 must show fewer median total tokens AND fewer median turns
      than redutok s1 — the learning slope exists
  - id: learning-pays
    description: >-
      redutok s3 must beat vanilla s3 on median total tokens, with redutok s3
      success rate at least vanilla s3's — the learning pays at parity
