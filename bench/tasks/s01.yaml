# Slope sequence position 1 (bench/tiers/slope.yaml), rewritten for the
# full-posture axios fixture after the idle-posture diagnosis. Read-shaped:
# a deep trace through the URL-assembly neighborhood. fixtureLogs is
# required by the loader but never replayed: replay and the flat live
# matrix exclude slope tasks.
repo:
  url: https://github.com/axios/axios
  commit: b2cb45d5a533a5465c99559b16987e4d5fc08cbc
  localPath: fixtures/repos/axios
prompt: 'In this repo, trace how axios builds the final request URL when a config carries both baseURL and url: name the function that decides whether baseURL applies at all, quote the rule it uses to detect an absolute URL, name the helper that joins the two parts, and explain what happens to slashes at the joint when the base ends with one and the relative part starts with one.'
success:
  - kind: answer-contains
    needle: 'buildFullPath'
  - kind: answer-contains
    needle: 'isAbsoluteURL'
  - kind: answer-contains
    needle: 'combineURLs'
fixtureLogs:
  vanilla: fixtures/sessions/long-agentic.jsonl
  redutok: fixtures/sessions/medium.jsonl
