id: s01
tier: slope
# Slope sequence position 1 (bench/tiers/slope.yaml). Same upstream pin as
# t05-t07. fixtureLogs is required by the loader but never replayed: replay
# and the flat live matrix exclude slope tasks, which only mean anything run
# in sequence with carried .dcp state.
repo:
  url: https://github.com/chalk/chalk
  commit: aa06bb5ac3f14df9fda8cfb54274dfc165ddfdef
  localPath: fixtures/repos/chalk
prompt: 'In this repo, explain how a chained style like chalk.red.bold builds the escape sequences it wraps around a string: name the function that accumulates the combined open and close codes, explain how a child styler combines its codes with its parent, and quote the exact lines that do the accumulation.'
success:
  - kind: answer-contains
    needle: 'createStyler'
  - kind: answer-contains
    needle: 'openAll'
  - kind: answer-contains
    needle: 'closeAll'
fixtureLogs:
  vanilla: fixtures/sessions/long-agentic.jsonl
  redutok: fixtures/sessions/medium.jsonl
