prompt: 'Trace exactly how `new Chalk({level: 3}).red("foo")` produces ANSI escape codes and how `new Chalk({level: 0}).red("foo")` instead returns the plain string "foo". Your answer must cover, with evidence from the source: (1) where in source/index.js the level value gates whether escape codes are emitted at all; (2) how source/index.js''s levelMapping array picks between the ansi, ansi256, and ansi16m color models based on level; (3) where those per-level ANSI code generators actually live in source/vendor/ansi-styles/index.js; (4) how source/vendor/supports-color/index.js computes the default level when no options are passed at all; (5) how source/utilities.js prevents a styled string containing an embedded newline from leaking its ANSI codes across the line break; and (6) name the existing test in test/chalk.js that pins the level-0 plain-string behavior.'
success:
  - kind: answer-contains
    needle: 'levelMapping'
  - kind: answer-contains
    needle: 'stringEncaseCRLFWithFirstIndex'
  - kind: answer-contains
    needle: 'wrapAnsi16m'
  - kind: answer-contains
    needle: 'translateLevel'
  - kind: answer-contains
    needle: 'emit RGB codes if level is 0'
