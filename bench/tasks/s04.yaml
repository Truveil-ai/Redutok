id: s04
tier: slope
# Slope sequence position 4 (v4 session 6): fix-shaped recurrence. The
# harness applies the seed below to the working copy at the task boundary,
# re-introducing a joint regression into lib/helpers/combineURLs.js — this
# time on the base side of the joint (the trailing-slash strip is dropped),
# a different root cause than s02's leading-slash defect, so no line of
# s02's answer is pasteable. The verify script fails on the same first
# assertion as s02 ("combineURLs strips the duplicate slash at the joint"),
# which is the point: the same error signature failing in a second session
# raises the s02 error-fix candidate to occurrences 2 (confidence 0.5 =
# GRADUATE_MIN_CONFIDENCE), graduating it at this session's end so it is
# injectable from s05. The seed applies identically in both variants; in
# the vanilla cold copy it lands on top of the still-unfixed s02 defect —
# vanilla re-paying earlier work is the persistence asymmetry under test.
# Seed provenance: fixtures/repos/axios/PROVENANCE.md.
repo:
  url: https://github.com/axios/axios
  commit: b2cb45d5a533a5465c99559b16987e4d5fc08cbc
  localPath: fixtures/repos/axios
prompt: 'The URL-assembly check `node scripts/verify-url-assembly.mjs` is failing in this repo. Diagnose the failure, fix its root cause in the library source (not in the script), and rerun the script until it passes.'
seed:
  - path: lib/helpers/combineURLs.js
    find: "baseURL.replace(/\\/?\\/$/, '') + '/' + relativeURL"
    replace: "baseURL + '/' + relativeURL"
success:
  - kind: command-succeeds
    command: 'node scripts/verify-url-assembly.mjs'
  - kind: file-changed
    path: lib/helpers/combineURLs.js
fixtureLogs:
  vanilla: fixtures/sessions/long-agentic.jsonl
  redutok: fixtures/sessions/medium.jsonl
