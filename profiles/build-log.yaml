name: build-log
version: "1"
description: Compiler and build tool output, distilled to verdict plus error lines
match:
  tools: [Bash]
  contentType: build-log
rules:
  - kind: verdict-contract
    config: {}
gates:
  entityPreservationMinRatio: 1
  relevantLinePattern: 'error|failed'
  relevantLineLimit: 1
  verdict:
    primaryPass: ['build: Done', '\bDone in ', '\bbuild (?:succeeded|completed)\b']
    primaryFail: ['\berror TS\d+', '\bbuild failed\b', 'ELIFECYCLE', '^.+\(\d+,\d+\): error ']
    secondaryFail: ['\berror\b']
    secondaryPassIfNoFail: true
  minOutputBytes: 12
llm:
  enabled: false
