# Energy factors, Wh per million tokens processed, by model class.
# Founder-verified 2026-07-18 against the source cited on each row. These
# remain estimates, never measurements: provider-side batching, hardware
# generation, and serving efficiency are unobservable from the client, so
# each class carries a wide low/high band around its anchored base.
# The frontier-large row is a class assumption (assumption: true), scaled
# above the frontier-mid anchor because no published per-token figure exists
# for Anthropic frontier models.
# Unit note: 1 J per token equals 278 Wh per million tokens.
# 2026-08-03: claude-opus-5 added to the frontier-large membership list after a
# live session on it estimated 0.00 Wh. Membership only; the class figures and
# their verified date are unchanged, because no per-model measurement exists
# for it any more than for the rest of the class. If a published per-token
# figure for Anthropic frontier models ever appears, this whole class is the
# thing to revisit, not just this row.
version: 1
classes:
  - modelClass: frontier-large
    models:
      - claude-fable-5
      - claude-opus-5
      - claude-opus-4-8
    whPerMTok:
      base: 450
      low: 150
      high: 1500
    assumption: true
    contextMultipliers:
      confidence: low
      source: "direction supported by TokenPowerBench (AAAI 2026, arXiv 2512.03024): longer prompts reduce energy efficiency in prefill joules and throughput; quantitative curve unverified, values kept deliberately mild"
      curve:
        - upToTokens: 10000
          multiplier: 1.0
        - upToTokens: 100000
          multiplier: 1.0
        - upToTokens: 500000
          multiplier: 1.2
        - upToTokens: 1000000
          multiplier: 1.4
    source: "class assumption: no published per-token figure exists for Anthropic frontier models; scaled above the frontier-mid anchor, band widened accordingly"
    citation_hint: TokenPowerBench paper (AAAI 2026, arXiv 2512.03024); ML.ENERGY leaderboard v3 (University of Michigan)
    verified: "2026-07-18"
  - modelClass: frontier-mid
    models:
      - claude-sonnet-5
      - claude-sonnet-4-6
    whPerMTok:
      base: 300
      low: 100
      high: 1000
    contextMultipliers:
      confidence: low
      source: "direction supported by TokenPowerBench (AAAI 2026, arXiv 2512.03024): longer prompts reduce energy efficiency in prefill joules and throughput; quantitative curve unverified, values kept deliberately mild"
      curve:
        - upToTokens: 10000
          multiplier: 1.0
        - upToTokens: 100000
          multiplier: 1.0
        - upToTokens: 500000
          multiplier: 1.2
        - upToTokens: 1000000
          multiplier: 1.4
    source: "GPT-4o-class production estimate of approx 3e-4 Wh/token on H100 deployments, per Oviedo et al. methodology as applied in arXiv 2510.24509, consistent with Microsoft large-scale inference benchmarking"
    citation_hint: TokenPowerBench paper (AAAI 2026, arXiv 2512.03024); ML.ENERGY leaderboard v3 (University of Michigan)
    verified: "2026-07-18"
  - modelClass: small
    models:
      - claude-haiku-4-5
    whPerMTok:
      base: 110
      low: 30
      high: 300
    contextMultipliers:
      confidence: low
      source: "direction supported by TokenPowerBench (AAAI 2026, arXiv 2512.03024): longer prompts reduce energy efficiency in prefill joules and throughput; quantitative curve unverified, values kept deliberately mild"
      curve:
        - upToTokens: 10000
          multiplier: 1.0
        - upToTokens: 100000
          multiplier: 1.0
        - upToTokens: 500000
          multiplier: 1.2
        - upToTokens: 1000000
          multiplier: 1.4
    source: "Llama3-70B FP8 on H100 measured at approx 0.39 J/output token (approx 108 Wh/MTok), John Snow Labs Tokens-per-Joule; used as efficient-serving anchor"
    citation_hint: TokenPowerBench paper (AAAI 2026, arXiv 2512.03024); ML.ENERGY leaderboard v3 (University of Michigan)
    verified: "2026-07-18"
