# Model pricing, USD per million tokens, standard API rates.
# Rates checked 2026-07-19 against the source URL on each row.
# Cache read is 0.10 of the input price. Cache writes have two TTL tiers,
# priced differently and billed separately in the meter's cost computation:
# 5-minute writes (cacheWritePerMTokUsd) are 1.25 of the input price,
# 1-hour writes (cacheWrite1hPerMTokUsd) are 2.00 of the input price.
# Thinking tokens bill at the output rate (applied in the meter's cost computation).
# Guardrail 2: every row carries a source field. Do not add a row without one.
#
# claude-sonnet-5 deviation from the documented price (2026-07-19): the
# official page promises introductory pricing (2.00/10.00) through
# 2026-08-31, but every claude-sonnet-5 request observed in
# bench/runs/*.stream.jsonl on 2026-07-19 (20/20 runs, reverse-computed
# exactly against each run's own total_cost_usd) was billed at the standard
# rate (3.00/15.00) with the 1-hour cache-write tier. This row follows
# observed billing rather than the documented promise; see PROGRESS.md's
# 2026-07-19 verification record for the reconciliation and evidence.
